<!doctype html><meta charset="utf-8">
<body style="margin:0;width:1000px;height:640px;background:#fff;font-family:Arial">
<svg width="1000" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="as" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5a6b78"/>
    </marker>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F4257">Acceso al área de miembros (magic link)</text>

  <!-- cabeceras de línea de vida -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="55" y="52" width="140" height="40" rx="8" fill="#1F4257"/><text x="125" y="77" fill="#fff">Miembro</text>
    <rect x="300" y="52" width="160" height="40" rx="8" fill="#3D6B8E"/><text x="380" y="77">Web (/miembros)</text>
    <rect x="560" y="52" width="180" height="40" rx="8" fill="#3D6B8E"/><text x="650" y="77">Servidor (regla + BD)</text>
    <rect x="830" y="52" width="120" height="40" rx="8" fill="#7FA8C9"/><text x="890" y="77" fill="#12293a">Resend</text>
  </g>
  <g stroke="#c3ccd4" stroke-dasharray="5 4" stroke-width="1.5">
    <line x1="125" y1="92" x2="125" y2="590"/>
    <line x1="380" y1="92" x2="380" y2="590"/>
    <line x1="650" y1="92" x2="650" y2="590"/>
    <line x1="890" y1="92" x2="890" y2="590"/>
  </g>

  <g font-size="12" fill="#3d4852">
    <line x1="125" y1="130" x2="374" y2="130" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#as)"/>
    <text x="250" y="118" text-anchor="middle">1 · introduce su correo institucional</text>

    <line x1="380" y1="175" x2="644" y2="175" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#as)"/>
    <text x="512" y="163" text-anchor="middle">2 · POST /api/intranet/request-link (límite de tasa)</text>

    <rect x="658" y="200" width="270" height="40" rx="6" fill="#eef3f7" stroke="#c3ccd4"/>
    <text x="672" y="216">3 · regla de acceso: veto / autorizado /</text>
    <text x="672" y="232">miembro con correo en ficha (alta automática)</text>
    <line x1="650" y1="205" x2="658" y2="205" stroke="#5a6b78" stroke-width="1.8"/>

    <rect x="658" y="258" width="270" height="26" rx="6" fill="#eef3f7" stroke="#c3ccd4"/>
    <text x="672" y="275">4 · crea token de un solo uso (30 min)</text>
    <line x1="650" y1="263" x2="658" y2="263" stroke="#5a6b78" stroke-width="1.8"/>

    <line x1="650" y1="315" x2="884" y2="315" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#as)"/>
    <text x="767" y="303" text-anchor="middle">5 · envía el correo con el enlace</text>

    <line x1="890" y1="360" x2="131" y2="360" stroke="#5a6b78" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#as)"/>
    <text x="510" y="348" text-anchor="middle">6 · correo «Tu enlace de acceso» (plantilla institucional, logo incrustado)</text>

    <line x1="125" y1="415" x2="644" y2="415" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#as)"/>
    <text x="385" y="403" text-anchor="middle">7 · abre el enlace (callback del proveedor «intranet» de NextAuth)</text>

    <rect x="658" y="440" width="270" height="40" rx="6" fill="#eef3f7" stroke="#c3ccd4"/>
    <text x="672" y="456">8 · consume el token (se borra al usarse)</text>
    <text x="672" y="472">y crea la sesión JWT con rol INTRANET</text>
    <line x1="650" y1="445" x2="658" y2="445" stroke="#5a6b78" stroke-width="1.8"/>

    <line x1="650" y1="520" x2="131" y2="520" stroke="#5a6b78" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#as)"/>
    <text x="390" y="508" text-anchor="middle">9 · área de miembros: Documentos · Noticias internas · Mi perfil</text>
  </g>

  <text x="500" y="620" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8b98a5">Si la dirección no está autorizada (paso 3), la web indica a quién solicitar el acceso; un enlace caducado o ya usado permite pedir otro.</text>
</svg>
